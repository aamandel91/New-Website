name: Type Check

on:
  pull_request:
    branches: ['**']
  push:
    branches:
      - feat/tenant-env-switch-countryclub-cleanup

jobs:
  frontend:
    name: Frontend (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Root lockfile is currently out of sync; use `npm install` until it's cleaned up
      - run: npm install --no-audit --no-fund
      - run: npm run tsc

  backend:
    name: Backend (/backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
